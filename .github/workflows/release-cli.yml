name: Release CLI

on:
  push:
    tags:
      - cli-v*
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.5.0)'
        required: true
        default: ''

permissions:
  contents: write  # required to create GitHub Releases and upload assets

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  REPO_OWNER: navadeep0508
  REPO_NAME: KRYTH-Browser

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve CLI version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            VERSION="${VERSION#v}"
          elif [[ "$GITHUB_REF" == refs/tags/cli-v* ]]; then
            VERSION="${GITHUB_REF_NAME#cli-v}"
            VERSION="${VERSION#v}"
          else
            echo "Run this workflow on a cli-v<version> tag or provide a version input." >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=cli-v${VERSION}" >> "$GITHUB_OUTPUT"

  guard:
    name: Verify version matches Cargo.toml
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify tag matches Cargo.toml workspace version
        shell: bash
        run: |
          set -euo pipefail
          CARGO_VERSION="$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          RELEASE_VERSION="${{ needs.resolve.outputs.version }}"
          if [ "$CARGO_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Cargo.toml version (${CARGO_VERSION}) does not match release version (${RELEASE_VERSION})" >&2
            exit 1
          fi
          echo "Version guard passed: ${RELEASE_VERSION}"

  build-cli:
    name: Build CLI ${{ matrix.target }}
    needs: [resolve, guard]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            artifact_name: bsk-v${{ needs.resolve.outputs.version }}-x86_64-pc-windows-msvc.zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            artifact_name: bsk-v${{ needs.resolve.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
            artifact_name: bsk-v${{ needs.resolve.outputs.version }}-aarch64-unknown-linux-gnu.tar.gz
          - target: x86_64-apple-darwin
            os: macos-15-intel
            archive: tar.gz
            artifact_name: bsk-v${{ needs.resolve.outputs.version }}-x86_64-apple-darwin.tar.gz
          - target: aarch64-apple-darwin
            os: macos-15
            archive: tar.gz
            artifact_name: bsk-v${{ needs.resolve.outputs.version }}-aarch64-apple-darwin.tar.gz
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Build bsk
        shell: bash
        run: |
          set -o pipefail
          RUST_BACKTRACE=full cargo build --release --locked -p bsk

      - name: Package artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve.outputs.version }}"
          ARTIFACT_NAME="${{ matrix.artifact_name }}"
          ARTIFACT_PATH="${GITHUB_WORKSPACE}/${ARTIFACT_NAME}"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            pwsh -NoProfile -Command "Compress-Archive -LiteralPath '${GITHUB_WORKSPACE}/target/release/bsk.exe' -DestinationPath '${ARTIFACT_PATH}' -Force"
          else
            tar -czf "${ARTIFACT_PATH}" -C "target/release" bsk
          fi
          test -f "${ARTIFACT_PATH}"
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "artifact_path=${ARTIFACT_PATH}" >> "$GITHUB_OUTPUT"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 30

  build-extension:
    name: Build browser extension
    needs: [resolve, guard]
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension zip
        run: pnpm ext:build:zip

      - name: Package extension artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve.outputs.version }}"
          ARTIFACT_NAME="browser-agent-extension-v${VERSION}-chrome.zip"
          ZIP=""
          for dir in apps/extension/dist apps/extension/.output; do
            if [ -d "$dir" ]; then
              ZIP="$(find "$dir" -maxdepth 1 -name '*chrome*.zip' -type f 2>/dev/null | head -n 1)"
              [ -n "$ZIP" ] && break
            fi
          done
          if [ -z "$ZIP" ]; then
            echo "Could not find the Chrome extension zip"
            find apps/extension -name '*.zip' -type f || true
            exit 1
          fi
          ARTIFACT_PATH="${GITHUB_WORKSPACE}/${ARTIFACT_NAME}"
          cp "$ZIP" "${ARTIFACT_PATH}"
          test -f "${ARTIFACT_PATH}"
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "artifact_path=${ARTIFACT_PATH}" >> "$GITHUB_OUTPUT"

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: [resolve, guard, build-cli, build-extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Download all CLI artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/cli
          merge-multiple: true

      - name: Download extension artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-extension.outputs.artifact_name }}
          path: dist/extension

      - name: List downloaded artifacts
        shell: bash
        run: |
          find dist -type f | sort

      - name: Generate SHA-256 checksums
        id: checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve.outputs.version }}"
          cd dist
          for f in cli/* extension/*; do
            [ -f "$f" ] || continue
            sha256sum "$f" | awk '{print $1"  *"$2}'
          done > checksums.txt
          cat checksums.txt

      - name: Generate version.json manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve.outputs.version }}"
          REPO="${{ env.REPO_OWNER }}/${{ env.REPO_NAME }}"
          TAG="cli-v${VERSION}"
          cd dist

          VERSION="${VERSION}" TAG="${TAG}" REPO="${REPO}" python3 - <<'PY'
          import json, hashlib, os, sys
          version = os.environ["VERSION"]
          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          server_url = "https://github.com"
          branch = "main"
          release_base = f"{server_url}/{repo}/releases/download/{tag}"

          platform_map = {
            "x86_64-pc-windows-msvc": "windows-x64",
            "x86_64-unknown-linux-gnu": "linux-x64",
            "aarch64-unknown-linux-gnu": "linux-arm64",
            "x86_64-apple-darwin": "darwin-x64",
            "aarch64-apple-darwin": "darwin-arm64",
          }

          assets = {}
          cli_dir = os.path.join("cli")
          ext_dir = os.path.join("extension")

          for fname in sorted(os.listdir(cli_dir)):
            fpath = os.path.join(cli_dir, fname)
            if not os.path.isfile(fpath):
                continue
            prefix = f"bsk-v{version}-"
            suffix_zip = ".zip"
            suffix_tar = ".tar.gz"
            triple = None
            if fname.startswith(prefix) and fname.endswith(suffix_zip):
                triple = fname[len(prefix):-len(suffix_zip)]
            elif fname.startswith(prefix) and fname.endswith(suffix_tar):
                triple = fname[len(prefix):-len(suffix_tar)]
            if triple and triple in platform_map:
                with open(fpath, "rb") as f:
                    sha = hashlib.sha256(f.read()).hexdigest()
                assets[platform_map[triple]] = {
                    "url": f"{release_base}/{fname}",
                    "sha256": sha,
                }

          for fname in sorted(os.listdir(ext_dir)):
            fpath = os.path.join(ext_dir, fname)
            if not os.path.isfile(fpath):
                continue
            if fname.endswith(".zip"):
                with open(fpath, "rb") as f:
                    sha = hashlib.sha256(f.read()).hexdigest()
                assets["browser-extension"] = {
                    "url": f"{release_base}/{fname}",
                    "sha256": sha,
                }

          expected = {
              "windows-x64",
              "linux-x64",
              "linux-arm64",
              "darwin-x64",
              "darwin-arm64",
              "browser-extension",
          }
          missing = expected - assets.keys()
          if missing:
              raise SystemExit(f"missing release artifacts: {', '.join(sorted(missing))}")

          manifest = {
              "name": "bsk",
              "version": version,
              "tag": tag,
              "released_at": __import__("datetime").datetime.utcnow().isoformat() + "Z",
              "release_url": f"{server_url}/{repo}/releases/tag/{tag}",
              "install_sh": f"https://raw.githubusercontent.com/{repo}/{branch}/install.sh",
              "install_ps1": f"https://raw.githubusercontent.com/{repo}/{branch}/install.ps1",
              "assets": assets,
          }

          with open("version.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Create GitHub Release
        id: create_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve.outputs.version }}"
          TAG="cli-v${VERSION}"
          RELEASE_NOTES=$(cat <<EOF
          # Browser Agent CLI v${VERSION}

          ## Installation

          ### macOS / Linux
          ```sh
          curl -fsSL https://raw.githubusercontent.com/navadeep0508/KRYTH-Browser/main/install.sh | sh
          ```

          ### Windows (PowerShell)
          ```powershell
          irm https://raw.githubusercontent.com/navadeep0508/KRYTH-Browser/main/install.ps1 | iex
          ```

          ## Assets

          - CLI binaries for Windows, Linux, and macOS
          - Browser extension zip (unpacked-extension install)
          - SHA-256 checksums and version.json manifest included

          ## Verification

          Verify each downloaded artifact against checksums.txt before installation.
          EOF
          )

          if gh release view "${TAG}" --repo "${{ env.REPO_OWNER }}/${{ env.REPO_NAME }}" >/dev/null 2>&1; then
            gh release edit "${TAG}" \
              --title "Browser Agent CLI v${VERSION}" \
              --notes "${RELEASE_NOTES}" \
              --repo "${{ env.REPO_OWNER }}/${{ env.REPO_NAME }}" \
              --latest
          else
            gh release create "${TAG}" \
              --title "Browser Agent CLI v${VERSION}" \
              --notes "${RELEASE_NOTES}" \
              --repo "${{ env.REPO_OWNER }}/${{ env.REPO_NAME }}" \
              --latest
          fi

          echo "release_created=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload CLI assets to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve.outputs.version }}"
          TAG="cli-v${VERSION}"
          for f in dist/cli/*; do
            [ -f "$f" ] || continue
            gh release upload "${TAG}" "$f" --repo "${{ env.REPO_OWNER }}/${{ env.REPO_NAME }}" --clobber
          done

      - name: Upload extension asset to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve.outputs.version }}"
          TAG="cli-v${VERSION}"
          for f in dist/extension/*; do
            [ -f "$f" ] || continue
            gh release upload "${TAG}" "$f" --repo "${{ env.REPO_OWNER }}/${{ env.REPO_NAME }}" --clobber
          done

      - name: Upload checksums and version.json to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve.outputs.version }}"
          TAG="cli-v${VERSION}"
          gh release upload "${TAG}" dist/checksums.txt dist/version.json --repo "${{ env.REPO_OWNER }}/${{ env.REPO_NAME }}" --clobber
