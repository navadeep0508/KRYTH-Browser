name: Publish CLI

on:
  workflow_run:
    workflows: [Release CLI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release was created
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Confirm release exists
        shell: bash
        run: |
          echo "Release CLI workflow completed successfully."
          echo "Artifacts and version.json were published as part of the Release CLI workflow."
          echo "See the GitHub Releases page for the published release."
